[package]
name = "fast_html2md"
version = "0.0.49"
edition = "2024"
description = "A fast html2md crate for rust"
categories = ["development-tools", "parsing", "parser-implementations"]
keywords = ["html", "markdown", "converter"]
license = "MIT"
documentation = "https://docs.rs/fast_html2md"
repository = "https://github.com/spider-rs/html2md"
authors = ["j-mendez <jeff@spider.cloud>"]
readme = "../README.md"

[lib]
name = "html2md"

[dependencies]
regex-lite = "0.1"
url = { version = "2.5", default-features = false }
percent-encoding = { version = "2.3", default-features = false }
auto_encoder = "0.1"
lol_html = "2.7"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must-use-candidate = "allow"
missing-errors-doc = "allow"
implicit-hasher = "allow"
ref-option = "allow"
